<body>
<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="wrap" id="app"></div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>
<div id="pops"></div>

<script>
/* ================= Util ================= */
const $=(s,r=document)=>r.querySelector(s);
const MONTHS=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const DAYS=['Isn','Sel','Rab','Kha','Jum','Sab','Ahd'];
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const P=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const S=t=>{const d=new Date(t);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const addDays=(s,n)=>S(P(s)+n*864e5);
const diffDays=(a,b)=>Math.round((P(b)-P(a))/864e5);
const dow=s=>(new Date(P(s)).getUTCDay()+6)%7;
const dmy=s=>s?`${s.slice(8)}/${s.slice(5,7)}/${s.slice(0,4)}`:'';
const fmt=n=>'RM '+(Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:(r&3|8)).toString(16)}));
const LS='homestay-hq-v1';

/* ================= State ================= */
const DEFAULT_SETTINGS={people:{},name:'Homestay D\'Hutan',units:['Seluruh rumah'],owners:['Saya','Partner'],wdRate:300,wkRate:300,depositAmt:150,ciTime:'15:00',coTime:'12:00'};
let settings={...DEFAULT_SETTINGS};
let bookings=[];
let expenses=[];
const CATS=['Pembersihan','Mesin rumput','Dobi','Bil TNB','Bil SAJ','Bil WiFi','Lain-lain'];
let view=(location.hash.slice(1)||'kalendar');
if(!['kalendar','senarai','duit','urus','setting'].includes(view))view='kalendar';
let cur=(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()}})();
let unitFilter='all',q='',stFilter='all';
let sb=null,session=null,mode='local',draft=null,dlCap=null,allowed=null,subscribed=false;
const cfg=window.HOMESTAY_CONFIG||{};
const canEdit=()=>!sb||(!!session&&allowed===true);

/* ================= Business logic ================= */
function roomCharge(b){
  if(b.totalFixed!==null&&b.totalFixed!==undefined&&b.totalFixed!=='')return Number(b.totalFixed);
  const n=diffDays(b.ci,b.co); if(!(n>0))return 0;
  if(b.customRate!==null&&b.customRate!==''&&b.customRate!==undefined)return n*Number(b.customRate);
  let t=0; for(let i=0;i<n;i++){const d=dow(addDays(b.ci,i)); t+=(d===4||d===5)?settings.wkRate:settings.wdRate}
  return t;
}
function calc(b){
  const room=roomCharge(b), total=Math.max(0,room+(+b.extra||0)+(+b.damage||0)-(+b.discount||0));
  const pay=b.payments||[];
  const paid=pay.filter(p=>p.type!=='Deposit').reduce((a,p)=>a+(+p.amount||0),0);
  const dep=pay.filter(p=>p.type==='Deposit').reduce((a,p)=>a+(+p.amount||0),0);
  return{room,total,paid,dep,bal:total-paid,nights:Math.max(0,diffDays(b.ci,b.co))};
}
function status(b){
  if(b.cancelled)return'cancel';
  const c=calc(b); if(c.paid<=0)return'unpaid';
  return c.paid>=c.total-.005?'paid':'deposit';
}
const ST={unpaid:'Belum bayar',deposit:'Bayar separa',paid:'Lunas',cancel:'Dibatalkan'};
const overdue=b=>{const s=status(b);return(s==='unpaid'||s==='deposit')&&calc(b).bal>0&&b.balanceDue&&b.balanceDue<today()};
const badge=b=>`${b.postponed&&!b.cancelled?'<span class="badge post">Ditunda</span> ':''}<span class="badge ${status(b)}">${ST[status(b)]}</span>${overdue(b)?' <span class="badge late">Lewat</span>':''}`;
function overlapWith(b){return bookings.find(o=>o.id!==b.id&&!o.cancelled&&!b.cancelled&&!o.postponed&&!b.postponed&&o.unit===b.unit&&b.ci<o.co&&o.ci<b.co&&b.ci&&b.co)}
function waLink(b){
  let p=(b.phone||'').replace(/\D/g,''); if(!p)return null; if(p[0]==='0')p='6'+p;
  const c=calc(b);
  const m=`Salam ${b.name},\nTempahan ${settings.name} anda:\n📅 ${dmy(b.ci)} → ${dmy(b.co)} (${c.nights} malam)\n💰 Jumlah: ${fmt(c.total)}\n✅ Dibayar: ${fmt(c.paid)}\n⏳ Baki: ${fmt(c.bal)}${b.balanceDue&&c.bal>0?'\n🗓️ Baki sebelum: '+dmy(b.balanceDue):''}\nTerima kasih.`;
  return`https://wa.me/${p}?text=${encodeURIComponent(m)}`;
}

/* ================= Storage (Supabase / local) ================= */
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({settings,bookings,expenses}))}catch(e){}}
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s){settings={...DEFAULT_SETTINGS,...s.settings};bookings=s.bookings||[];expenses=s.expenses||[]}}catch(e){}}
async function loadAll(){
  if(!sb){loadLocal();return}
  const [b,s,x]=await Promise.all([sb.from('bookings').select('id,data'),sb.from('settings').select('data').eq('id',1).maybeSingle(),sb.from('expenses').select('id,data')]);
  if(b.error)throw b.error;
  bookings=(b.data||[]).map(r=>({...r.data,id:r.id}));
  if(!x.error)expenses=(x.data||[]).map(r=>({...r.data,id:r.id}));
  if(s.data&&s.data.data)settings={...DEFAULT_SETTINGS,...s.data.data};
}
async function dbSaveBooking(b){
  if(!sb){saveLocal();return}
  const{error}=await sb.from('bookings').upsert({id:b.id,data:b,updated_at:new Date().toISOString()});
  if(error)throw error;
}
async function dbDeleteBooking(id){
  if(!sb){saveLocal();return}
  const{error}=await sb.from('bookings').delete().eq('id',id); if(error)throw error;
}
async function dbSaveExpense(x){
  if(!sb){saveLocal();return}
  const{error}=await sb.from('expenses').upsert({id:x.id,data:x,updated_at:new Date().toISOString()}); if(error)throw error;
}
async function dbDeleteExpense(id){
  if(!sb){saveLocal();return}
  const{error}=await sb.from('expenses').delete().eq('id',id); if(error)throw error;
}
async function dbSaveSettings(){
  if(!sb){saveLocal();return}
  const{error}=await sb.from('settings').upsert({id:1,data:settings}); if(error)throw error;
}
function subscribe(){
  if(!sb||subscribed)return;subscribed=true;
  let t;const refresh=()=>{clearTimeout(t);t=setTimeout(async()=>{try{const s=snap();await loadAll();diffNotify(s);if(!draft)render()}catch(e){}},300)};
  sb.channel('hs').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'settings'},refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'expenses'},refresh).subscribe();
}


/* ================= Notifikasi ================= */
const me=()=>((session&&session.user&&session.user.email)||'').toLowerCase();
const who=e=>{const k=String(e||'').toLowerCase();return(settings.people&&settings.people[k])||(k?k.split('@')[0]:'Seseorang')};
function popup(title,msg,id){
  const box=$('#pops'); if(!box)return;
  const el=document.createElement('div'); el.className='pop';
  el.innerHTML=`<b>${esc(title)}</b><span>${esc(msg)}</span>`;
  el.onclick=()=>{el.remove();if(id){const b=bookings.find(x=>x.id===id);if(b&&canEdit())openModal(b,false)}};
  box.appendChild(el); setTimeout(()=>el.remove(),10000);
}
function snap(){
  const b={}; bookings.forEach(x=>{const c=calc(x);b[x.id]={ua:x.updatedAt||'',paid:c.paid,dep:c.dep,cancel:!!x.cancelled}});
  return{b,x:new Set(expenses.map(e=>e.id))};
}
function diffNotify(s){
  const m=me();
  bookings.forEach(b=>{
    if(!b.updatedAt||(b.updatedBy||'').toLowerCase()===m)return;
    const o=s.b[b.id], c=calc(b), by=who(b.updatedBy);
    if(!o){popup('Tempahan baharu',`${by} tambah ${b.name} (${dmy(b.ci)} – ${dmy(b.co)})`,b.id);return}
    if(o.ua===b.updatedAt)return;
    if(c.paid>o.paid+.005)popup('Bayaran diterima',`${by} catat bayaran ${fmt(c.paid-o.paid)} untuk ${b.name}. Baki ${fmt(c.bal)}`,b.id);
    else if(c.dep>o.dep+.005)popup('Deposit diterima',`${by} catat deposit ${fmt(c.dep-o.dep)} untuk ${b.name}`,b.id);
    else if(b.cancelled&&!o.cancel)popup('Tempahan dibatalkan',`${by} batalkan tempahan ${b.name}`,b.id);
    else popup('Tempahan dikemas kini',`${by} kemas kini tempahan ${b.name}`,b.id);
  });
  expenses.forEach(e=>{if(!s.x.has(e.id)&&e.updatedAt&&(e.updatedBy||'').toLowerCase()!==m)popup('Kos baharu',`${who(e.updatedBy)} catat ${e.cat} ${fmt(e.amount)}${e.note?' ('+e.note+')':''}`)});
}
let summarized=false;
function summarizeMissed(){
  if(summarized)return; summarized=true;
  const k='hs-seen-'+me(); let last=''; try{last=localStorage.getItem(k)||''}catch(e){}
  if(last){
    const m=me();
    const items=[...bookings.map(b=>({t:b.updatedAt,by:b.updatedBy,x:b.name})),...expenses.map(e=>({t:e.updatedAt,by:e.updatedBy,x:e.cat+' '+fmt(e.amount)}))].filter(i=>i.t&&i.t>last&&(i.by||'').toLowerCase()!==m);
    if(items.length)popup('Kemas kini sejak kali terakhir',`${items.length} perubahan oleh ${[...new Set(items.map(i=>who(i.by)))].join(', ')}: ${items.slice(0,3).map(i=>i.x).join(', ')}${items.length>3?'…':''}`);
  }
  try{localStorage.setItem(k,new Date().toISOString())}catch(e){}
}


/* ================= Push peranti ================= */
const b64ToU8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function pushPublicKey(){
  const c=await sb.from('app_config').select('value').eq('key','vapid_public').maybeSingle();
  if(c.data&&c.data.value)return c.data.value;
  const r=await sb.functions.invoke('notify',{body:{}});
  return r.data&&r.data.pub;
}
async function savePushSub(sub){
  const j=sub.toJSON();
  const{error}=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,email:me(),data:j},{onConflict:'endpoint'});
  if(error)throw error;
}
async function enablePush(){
  if(!sb||!(session&&allowed===true)){toast('Log masuk dulu');return}
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){toast('Peranti ini belum sokong push. Di iPhone: Share > Add to Home Screen, kemudian buka dari ikon itu.');return}
  if(Notification.permission==='denied'){toast('Notifikasi disekat. Benarkan di tetapan pelayar.');return}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Notifikasi tidak dibenarkan');return}
    const reg=await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const key=await pushPublicKey();
    if(!key){toast('Tak dapat kunci notifikasi');return}
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(key)});
    await savePushSub(sub);
    toast('Notifikasi peranti dihidupkan');
  }catch(e){toast('Gagal hidupkan notifikasi: '+(e.message||e))}
}
async function syncPush(){
  try{
    if(!sb||!('serviceWorker' in navigator)||!('PushManager' in window)||Notification.permission!=='granted')return;
    const reg=await navigator.serviceWorker.getRegistration('sw.js')||await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub)await savePushSub(sub);
  }catch(e){}
}

function calView(){
  const first=S(Date.UTC(cur.y,cur.m,1)), off=dow(first);
  const dim=new Date(Date.UTC(cur.y,cur.m+1,0)).getUTCDate();
  const weeks=Math.ceil((off+dim)/7);
  const start=addDays(first,-off);
  const list=bookings.filter(b=>!b.cancelled&&!b.postponed&&(unitFilter==='all'||b.unit===unitFilter));
  let cells='';
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i), inM=d.slice(5,7)==pad(cur.m+1);
    const occ=list.filter(b=>b.ci<=d&&d<b.co), outs=list.filter(b=>b.co===d);
    const chips=[...occ.map(b=>`<div class="chip ${status(b)}" data-act="edit" data-id="${b.id}" title="${esc(b.name)}">${b.ci===d?'→ ':''}${esc(b.name)}</div>`),...outs.map(b=>`<div class="chip outc" data-act="edit" data-id="${b.id}">← ${esc(b.name)}</div>`)];
    cells+=`<div class="day ${inM?'':'out'} ${d===today()?'today':''}" data-act="newday" data-date="${d}"><span class="n">${+d.slice(8)}</span>${chips.slice(0,3).join('')}${chips.length>3?`<span class="more">+${chips.length-3} lagi</span>`:''}</div>`;
  }
  const ups=bookings.filter(b=>!b.cancelled&&!b.postponed&&b.co>=today()).sort((a,b)=>a.ci<b.ci?-1:1).slice(0,6);
  return`<div class="layout"><div class="glass cal">
    <div class="calhead"><div class="row"><button class="icon" data-act="prev">‹</button><h2>${MONTHS[cur.m]} ${cur.y}</h2><button class="icon" data-act="next">›</button><button class="btn sec sm" data-act="tdy">Hari ni</button></div>
    ${activeUnits().length>1?`<select style="width:auto" id="unitSel"><option value="all">Semua unit</option>${activeUnits().map(u=>`<option ${unitFilter===u?'selected':''}>${esc(u)}</option>`).join('')}</select>`:''}</div>
    <div class="grid7">${DAYS.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
    <div class="legend"><span class="badge unpaid">Belum bayar</span><span class="badge deposit">Deposit masuk</span><span class="badge paid">Lunas</span><span class="pill">→ masuk · ← keluar</span></div>
  </div>
  <aside class="side"><div class="glass panel"><h3>Akan datang</h3>${ups.length?ups.map(b=>{const c=calc(b);return`<div class="up" data-act="edit" data-id="${b.id}"><b>${esc(b.name)}</b><span>${dmy(b.ci)} → ${dmy(b.co)} · ${c.nights} malam</span><div style="margin-top:6px">${badge(b)}${c.bal>0?` <span style="font-size:12px;color:var(--mut)">baki ${fmt(c.bal)}</span>`:''}</div></div>`}).join(''):'<div class="empty" style="padding:20px">Belum ada tempahan.<br>Tambah tempahan pertama anda.</div>'}</div></aside></div>`;
}

  <div><label>Harga semalam (RM)</label><input id="s_wd" type="number" min="0" step="1" value="${s.wdRate}"></div>
  <div><label>Deposit (RM, asing daripada sewa)</label><input id="s_dp" type="number" min="0" value="${s.depositAmt}"></div>
    <div><label>Masa check-in</label><input id="s_ci" type="time" value="${s.ciTime}"></div>
  <div><label>Masa check-out</label><input id="s_co" type="time" value="${s.coTime}"></div>
  <div class="full"><label>Unit / bilik (asing dengan koma)</label><input id="s_units" value="${esc(activeUnits().join(', '))}"></div>
  <div class="full"><label>Nama anda &amp; partner (asing dengan koma)</label><input id="s_owners" value="${esc((s.owners||[]).join(', '))}"></div></div>
  </fieldset><div class="row" style="margin-top:16px">${canEdit()?'<button class="btn" type="submit">Simpan tetapan</button>':''}<button type="button" class="btn sec" data-act="csv">Export CSV</button><button type="button" class="btn sec" data-act="json">Backup JSON</button></div></form></div>`;
}

/* ================= Booking modal ================= */
function newBooking(pre={}){
  const ci=pre.ci||today();
  return{id:uid(),name:'',phone:'',ic:'',ci,co:pre.co||addDays(ci,1),ciTime:settings.ciTime,coTime:settings.coTime,adults:2,kids:0,unit:pre.unit||(unitFilter!=='all'?unitFilter:activeUnits()[0]),customRate:null,extra:0,extraNote:'',discount:0,damage:0,totalFixed:null,postponed:false,payments:[],balanceDue:'',source:'WhatsApp',handler:(settings.owners||[])[0]||'',notes:'',cancelled:false,created:today()};
}
function openModal(b,isNew){
  draft=JSON.parse(JSON.stringify(b)); draft._new=isNew;
  const d=draft, sel=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  $('#modal-root').innerHTML=`<div class="overlay" data-act="closeov"><form class="modal" id="bf">
  <div class="row" style="justify-content:space-between"><h2>${isNew?'Tempahan baru':'Edit tempahan'}</h2><button type="button" class="icon" data-act="close">✕</button></div>
  <div class="blk"><h4>Penyewa</h4><div class="fg">
    <div class="full"><label>Nama penyewa *</label><input id="f_name" value="${esc(d.name)}" placeholder="Cth: Ahmad bin Ali" required></div>
    <div><label>No. telefon</label><input id="f_phone" value="${esc(d.phone)}" placeholder="012-3456789" inputmode="tel"></div>
    <div><label>No. KP / Pasport</label><input id="f_ic" value="${esc(d.ic)}"></div>
    <div><label>Sumber tempahan</label><select id="f_src">${sel(['WhatsApp','Instagram','TikTok','Facebook','Airbnb','Booking.com','Walk-in','Kawan / Referral','Lain-lain'],d.source)}</select></div>
    <div><label>Diuruskan oleh</label><select id="f_hand">${sel(settings.owners||[],d.handler)}</select></div></div></div>
  <div class="blk"><h4>Tarikh &amp; tetamu</h4><div class="fg">
    <div><label>Check-in *</label><input type="date" id="f_ci" value="${d.ci}" required></div>
    <div><label>Check-out *</label><input type="date" id="f_co" value="${d.co}" required></div>
    <div><label>Masa masuk</label><input type="time" id="f_cit" value="${d.ciTime}"></div>
    <div><label>Masa keluar</label><input type="time" id="f_cot" value="${d.coTime}"></div>
    <div><label>Dewasa</label><input type="number" id="f_ad" min="0" value="${d.adults}"></div>
    <div><label>Kanak-kanak</label><input type="number" id="f_kid" min="0" value="${d.kids}"></div>
    <div class="full"><label>Unit / bilik</label><select id="f_unit">${sel(activeUnits(),d.unit)}</select></div></div></div>
  <div class="blk"><h4>Harga</h4><div class="fg">
    <div><label>Harga/malam manual (kosong = auto)</label><input type="number" id="f_rate" min="0" value="${d.customRate??''}" placeholder="Auto: RM${settings.wdRate}/malam"></div>
    <div><label>Jumlah sewa manual (RM, kosong = auto)</label><input type="number" id="f_tot" min="0" value="${d.totalFixed??''}"></div>
    <div><label>Caj tambahan (RM)</label><input type="number" id="f_extra" min="0" value="${d.extra}"></div>
    <div><label>Nota caj (cth: BBQ)</label><input id="f_extran" value="${esc(d.extraNote)}"></div>
    <div><label>Caj kerosakan (RM)</label><input type="number" id="f_dmg" min="0" value="${d.damage||0}"></div>
    <div><label>Diskaun (RM)</label><input type="number" id="f_disc" min="0" value="${d.discount}"></div></div></div>
  <div class="blk"><h4>Deposit &amp; bayaran penuh</h4>
    <div id="pays"></div>
    <div class="row" style="margin:8px 0"><button type="button" class="btn sm sec" data-act="addDep">＋ Deposit RM150</button><button type="button" class="btn sm sec" data-act="addBal">＋ Bayar baki penuh</button><button type="button" class="btn sm sec" data-act="addPay">＋ Bayaran lain</button></div>
    <div class="fg"><div><label>Baki perlu dibayar sebelum</label><input type="date" id="f_due" value="${d.balanceDue}"></div>
    </div>
    <div class="calc" id="calc"></div></div>
  <div class="blk"><h4>Nota</h4><textarea id="f_notes" rows="3" placeholder="Permintaan khas, masa sampai, dll.">${esc(d.notes)}</textarea>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:600"><input type="checkbox" id="f_cancel" style="width:auto" ${d.cancelled?'checked':''}> Tempahan dibatalkan</label>
    <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:600"><input type="checkbox" id="f_post" style="width:auto" ${d.postponed?'checked':''}> Ditunda (tarikh baharu belum ditetapkan)</label></div>
  <div class="mfoot"><div>${isNew?'':'<button type="button" class="btn danger" data-act="del">Padam</button>'}</div><div class="row">${waLink(d)&&!isNew?`<a class="btn sec" href="${waLink(d)}" target="_blank" rel="noopener">WhatsApp</a>`:''}<button type="button" class="btn sec" data-act="close">Batal</button><button type="submit" class="btn">Simpan</button></div></div></form></div>`;
  renderPays(); updateCalc();
  if(!canEdit()){
    $('#bf').querySelectorAll('input,select,textarea').forEach(x=>x.disabled=true);
    $('#bf').querySelectorAll('[data-act=addDep],[data-act=addBal],[data-act=addPay],[data-act=del],button[type=submit]').forEach(x=>x.style.display='none');
    $('#bf h2').textContent='Butiran tempahan';
  }
}
function renderPays(){
  const mk=['Pindahan bank','DuitNow / QR','Tunai','Kad','Lain-lain','-'], tp=['Deposit','Bayaran penuh','Baki','Lain-lain'];
  const o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
  $('#pays').innerHTML=draft.payments.length?draft.payments.map(p=>`<div class="pay-row" data-id="${p.id}"><input type="date" class="p-date" value="${p.date}"><select class="p-type">${o(tp,p.type)}</select><input type="number" class="p-amt" min="0" step="0.01" value="${p.amount}" placeholder="RM"><select class="p-method">${o(mk,p.method)}</select>${canEdit()?`<button type="button" class="icon" data-act="rmPay" data-id="${p.id}">✕</button>`:'<span></span>'}</div>`).join(''):'<div style="color:var(--mut);font-size:13.5px">Belum ada bayaran. Tambah deposit atau bayaran di bawah.</div>';
}
function readForm(){
  const g=id=>document.getElementById(id), d=draft;
  d.name=g('f_name').value.trim();d.phone=g('f_phone').value.trim();d.ic=g('f_ic').value.trim();d.source=g('f_src').value;d.handler=g('f_hand').value;
  d.ci=g('f_ci').value;d.co=g('f_co').value;d.ciTime=g('f_cit').value;d.coTime=g('f_cot').value;d.adults=+g('f_ad').value||0;d.kids=+g('f_kid').value||0;d.unit=g('f_unit').value;
  const cr=g('f_rate').value;d.customRate=cr===''?null:+cr;d.extra=+g('f_extra').value||0;d.extraNote=g('f_extran').value;d.discount=+g('f_disc').value||0;
  d.balanceDue=g('f_due').value;d.damage=+g('f_dmg').value||0;d.notes=g('f_notes').value;d.cancelled=g('f_cancel').checked;d.postponed=g('f_post').checked;d.totalFixed=g('f_tot').value===''?null:+g('f_tot').value;
  d.payments=[...document.querySelectorAll('.pay-row')].map(r=>({id:r.dataset.id,date:r.querySelector('.p-date').value,type:r.querySelector('.p-type').value,method:r.querySelector('.p-method').value,amount:+r.querySelector('.p-amt').value||0}));
}
function updateCalc(){
  const c=calc(draft), pct=c.total>0?Math.min(100,c.paid/c.total*100):0, ov=overlapWith(draft);
  $('#calc').innerHTML=`<div class="l"><span>Penginapan (${c.nights} malam)</span><b>${fmt(c.room)}</b></div>
  <div class="l"><span>Tambahan + kerosakan − diskaun</span><b>${fmt((+draft.extra||0)+(+draft.damage||0)-(+draft.discount||0))}</b></div>
  <div class="l tot"><span>Jumlah</span><b>${fmt(c.total)}</b></div>
  <div class="l"><span>Dah bayar (sewa)</span><b>${fmt(c.paid)}</b></div>
  <div class="l"><span>Baki</span><b>${fmt(c.bal)}</b></div>
  <div class="l"><span>Deposit dipegang (asing daripada sewa)</span><b>${fmt(c.dep)}</b></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  ${diffDays(draft.ci||'2000-01-01',draft.co||'2000-01-01')<=0?'<div class="warn">⚠️ Tarikh check-out mesti selepas check-in.</div>':''}
  ${ov?`<div class="warn">⚠️ Bertindih dengan booking <b>${esc(ov.name)}</b> (${dmy(ov.ci)} → ${dmy(ov.co)}) di unit sama!</div>`:''}`;
}
async function submitBooking(){
  readForm(); const d=draft;
  if(!d.name){toast('Sila isi nama penyewa');return}
  if(!(diffDays(d.ci,d.co)>0)){toast('Check-out mesti selepas check-in');return}
  if(!d.balanceDue)d.balanceDue=d.ci;
  d.updatedBy=me();d.updatedAt=new Date().toISOString();
  const wasNew=d._new, prev=bookings.find(b=>b.id===d.id), prevSt=prev?status(prev):null;
  delete d._new;
  const i=bookings.findIndex(b=>b.id===d.id); if(i>=0)bookings[i]=d; else bookings.push(d);
  const b=d; draft=null; $('#modal-root').innerHTML=''; render();
  try{await dbSaveBooking(b);toast(wasNew?'Tempahan disimpan':'Dikemas kini')}catch(e){toast('Gagal simpan: '+(e.message||e));await loadAll().catch(()=>{});render();return}
  if(status(b)==='paid'&&prevSt!=='paid'){confetti()}
}
function closeModal(){draft=null;$('#modal-root').innerHTML=''}

/* ================= Export ================= */
function csvText(){
  const h=['Nama','Telefon','KP/Pasport','Unit','Check-in','Check-out','Malam','Dewasa','Kanak-kanak','Jumlah','Dibayar','Baki','Baki sebelum','Status','Deposit','Ditunda','Caj kerosakan','Sumber','Diuruskan oleh','Nota'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const r=[...bookings].sort((a,b)=>a.ci<b.ci?-1:1).map(b=>{const c=calc(b);return[b.name,b.phone,b.ic,b.unit,b.ci,b.co,c.nights,b.adults,b.kids,c.total,c.paid,c.bal,b.balanceDue,ST[status(b)],c.dep,b.postponed?'Ya':'',b.damage,b.source,b.handler,b.notes].map(q).join(',')});
  return[h.map(q).join(','),...r].join('\n');
}
function openText(title,text,filename){
  $('#modal-root').innerHTML=`<div class="overlay" data-act="closeov"><div class="modal"><div class="row" style="justify-content:space-between"><h2>${title}</h2><button class="icon" data-act="close">✕</button></div><textarea class="big" id="exp" readonly>${esc(text)}</textarea><div class="row" style="margin-top:12px"><button class="btn" data-act="copyExp">Salin</button>${dlCap?`<button class="btn sec" data-act="dlExp" data-fn="${filename}">Muat turun</button>`:''}</div></div></div>`;
}

/* ================= Events ================= */
document.addEventListener('click',async e=>{
  if(e.target.closest('[data-stop]'))return;
  const el=e.target.closest('[data-act]'); if(!el)return;
  if(el.dataset.act==='closeov'&&e.target!==el)return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==='tab'){view=el.dataset.v;location.hash=view;render()}
  else if(a==='prev'){cur.m--;if(cur.m<0){cur.m=11;cur.y--}render()}
  else if(a==='next'){cur.m++;if(cur.m>11){cur.m=0;cur.y++}render()}
  else if(a==='tdy'){const d=new Date();cur={y:d.getFullYear(),m:d.getMonth()};render()}
  else if(a==='new'){if(!canEdit())openLogin();else openModal(newBooking(),true)}
  else if(a==='login')openLogin();
  else if(a==='newday'){if(!canEdit())openLogin();else openModal(newBooking({ci:el.dataset.date}),true)}
  else if(a==='edit'){e.stopPropagation();const b=bookings.find(x=>x.id===id);if(b)openModal(b,false)}
  else if(a==='close'||a==='closeov')closeModal();
  else if(a==='bell'){await enablePush()}
  else if(a==='theme'){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('hs-theme',t)}catch(_){}}
  else if(a==='logout'){await sb.auth.signOut();session=null;allowed=false;bookings=[];expenses=[];render();toast('Dah log keluar')}
  else if(a==='forgot'){e.preventDefault();const em=$('#le').value.trim();if(!em){authMsg('Taip emel anda dulu di ruang Emel');return}authMsg('Menghantar…',true);const r=await authCall(()=>sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]}));if(r)authMsg(r.error?r.error.message:'Pautan tetapan semula dihantar. Semak emel anda (termasuk Spam).',!r.error)}
  else if(a==='signup'){const em=$('#le').value.trim(),pw=$('#lp').value;if(!em||pw.length<6){authMsg('Isi emel dan kata laluan (minimum 6 aksara) dulu');return}
    el.disabled=true;authMsg('Mendaftar…',true);
    const r=await authCall(()=>sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.href.split('#')[0]}}));el.disabled=false;
    if(r){if(r.error)authMsg(/database error|tidak dibenarkan/i.test(r.error.message)?'Emel ini tidak dibenarkan mendaftar.':r.error.message);else if(r.data&&r.data.session){session=r.data.session;closeModal();await afterAuth();toast('Akaun dibuat')}else authMsg('Akaun dibuat. Semak emel anda (termasuk Spam) dan tekan pautan pengesahan, kemudian log masuk.',true)}
  }
  else if(a==='addDep'||a==='addBal'||a==='addPay'){
    readForm();const c=calc(draft);
    const amt=a==='addDep'?settings.depositAmt:a==='addBal'?Math.max(0,c.bal):0;
    draft.payments.push({id:uid(),date:today(),type:a==='addDep'?'Deposit':a==='addBal'?(c.paid>0?'Baki':'Bayaran penuh'):'Lain-lain',method:'Pindahan bank',amount:amt});
    renderPays();updateCalc();
  }
  else if(a==='rmPay'){readForm();draft.payments=draft.payments.filter(p=>p.id!==id);renderPays();updateCalc()}
  else if(a==='del'){
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Pasti? Tekan lagi untuk padam';return}
    const did=draft.id;bookings=bookings.filter(b=>b.id!==did);closeModal();render();
    try{await dbDeleteBooking(did);toast('Dipadam')}catch(err){toast('Gagal padam: '+err.message);await loadAll().catch(()=>{});render()}
  }
  else if(a==='delExp'){
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Pasti?';return}
    expenses=expenses.filter(x=>x.id!==id);render();
    try{await dbDeleteExpense(id);toast('Kos dipadam')}catch(err){toast('Gagal padam: '+err.message);await loadAll().catch(()=>{});render()}
  }
  else if(a==='csv')openText('Export CSV',csvText(),'tempahan-homestay.csv');
  else if(a==='json')openText('Backup JSON',JSON.stringify({settings,bookings,expenses},null,2),'backup-homestay.json');
  else if(a==='copyExp'){const t=$('#exp');t.select();try{await navigator.clipboard.writeText(t.value);toast('Disalin')}catch(_){document.execCommand&&document.execCommand('copy');toast('Disalin (atau tekan Ctrl+C)')}}
  else if(a==='dlExp'){try{await dlCap.save({filename:el.dataset.fn,data:$('#exp').value})}catch(_){}}
});
document.addEventListener('input',e=>{
  if(e.target.closest('#bf')&&draft){
    if(e.target.id==='f_ci'){const c=$('#f_ci').value,o=$('#f_co');if(c&&o.value<=c)o.value=addDays(c,1)}
    readForm();updateCalc();
  }
  if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='stf'){stFilter=e.target.value;render()}
  if(e.target.id==='unitSel'){unitFilter=e.target.value;render()}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='bf')submitBooking();
  else if(e.target.id==='loginForm'){
    authMsg('Log masuk…',true);
    const r=await authCall(()=>sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value}));
    if(!r)return;
    if(r.error){authMsg(r.error.message==='Invalid login credentials'?'Emel atau kata laluan salah, atau akaun belum didaftar. Jika belum, tekan Daftar akaun.':r.error.message);return}
    session=r.data.session;closeModal();await afterAuth();if(allowed)toast('Log masuk berjaya');
  }
  else if(e.target.id==='expForm'){
    if(!canEdit())return;
    const g=id=>$('#'+id).value, amount=+g('x_amt');
    if(!(amount>0)){toast('Isi jumlah kos');return}
    const x={id:uid(),date:g('x_date')||today(),cat:g('x_cat'),amount,note:g('x_note').trim(),by:g('x_by'),bookingId:g('x_bk')||'',updatedBy:me(),updatedAt:new Date().toISOString()};
    expenses.push(x);render();
    try{await dbSaveExpense(x);toast('Kos disimpan')}catch(err){toast('Gagal simpan: '+err.message);await loadAll().catch(()=>{});render()}
  }
  else if(e.target.id==='newPassForm'){
    const{error}=await sb.auth.updateUser({password:$('#np').value});
    if(error){toast(error.message);return}
    closeModal();await afterAuth();toast('Kata laluan dikemas kini');
  }
  else if(e.target.id==='setForm'){
    if(!canEdit())return;
    const v=id=>$('#'+id).value, list=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
    settings={...settings,name:v('s_name')||'Homestay D\'Hutan',wdRate:+v('s_wd')||0,wkRate:+v('s_wd')||0,depositAmt:+v('s_dp')||0,ciTime:v('s_ci'),coTime:v('s_co'),units:list(v('s_units')).length?list(v('s_units')):['Seluruh rumah'],owners:list(v('s_owners'))};
    render();try{await dbSaveSettings();toast('Tetapan disimpan')}catch(err){toast('Gagal simpan: '+err.message)}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal()});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['kalendar','senarai','duit','urus','setting'].includes(v)&&v!==view){view=v;render()}});

/* ================= Boot ================= */
async function boot2(){await afterAuth()}
(async function boot(){
  try{const t=localStorage.getItem('hs-theme');if(t)document.documentElement.dataset.theme=t}catch(_){}
  if(window.claude&&claude.use){claude.use('downloads').then(d=>{dlCap=d}).catch(()=>{})}
  if(cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&window.supabase){
    sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);mode='supabase';
    const{data}=await sb.auth.getSession();session=data.session;
    sb.auth.onAuthStateChange((ev,s)=>{session=s;if(ev==='PASSWORD_RECOVERY')openNewPass()});
    await boot2();return;
  }
  loadLocal();render();
})();
</script>
</body>
